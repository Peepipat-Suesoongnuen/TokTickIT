name: CI

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: toktickit
          POSTGRES_PASSWORD: toktickit
          POSTGRES_DB: toktickit_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://toktickit:toktickit@localhost:5432/toktickit?schema=public
      TEST_DATABASE_URL: postgresql://toktickit:toktickit@localhost:5432/toktickit_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - working-directory: server
        run: npm ci
      - working-directory: server
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://toktickit:toktickit@localhost:5432/toktickit_test?schema=public
      - working-directory: server
        run: npx tsc --noEmit
      - working-directory: server
        run: npm test

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - working-directory: client
        run: npm ci
      - working-directory: client
        run: npx tsc --noEmit
      - working-directory: client
        run: npm test
