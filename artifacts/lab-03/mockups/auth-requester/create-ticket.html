<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TokTickIT Lab 3 Mockup — Requester Create Ticket</title>
  <link rel="stylesheet" href="mockup.css" />
</head>
<body>
  <header class="zen-header"><div class="container header-row"><div class="brand">TokTickIT <small>IT Service Desk</small></div><div class="identity-actions"><span class="identity-chip">👤 Anucha Wongprecha</span><span class="role-chip">REQUESTER</span><button class="btn btn-header">Change Password</button><button class="btn btn-header">Logout</button></div></div></header>
  <nav class="nav-shell"><div class="container nav-row"><button class="nav-toggle">☰</button><div class="nav-links"><a class="nav-link">My Tickets</a><a class="nav-link active">Create Ticket</a></div></div></nav>
  <main class="container main">
    <div class="screen-heading"><h1 class="h4">Create Ticket</h1><div class="actions"><button class="btn btn-outline">Back to My Tickets</button></div></div>
    <section class="card mb-3"><div class="card-body row row-3"><div class="field"><label class="label small">Ticket Number</label><input class="control readonly" value="Generated after submission" readonly></div><div class="field"><label class="label small">Ticket Date</label><input class="control readonly" value="—" readonly></div><div class="field"><label class="label small">Requester</label><input class="control readonly" value="Anucha Wongprecha" readonly></div></div></section>
    <div class="row row-3 mb-3"><div class="field"><label class="label">Category <span class="required">*</span></label><select class="control"><option>-- Select --</option></select></div><div class="field"><label class="label">Related System <span class="required">*</span></label><select class="control"><option>-- Select --</option></select></div><div class="field"><label class="label">Requested Priority <span class="required">*</span></label><select class="control"><option>MEDIUM</option></select></div></div>
    <div class="field mb-3"><label class="label">Summary <span class="required">*</span></label><input class="control"><div class="form-text">5–120 characters</div></div>
    <div class="field mb-3"><label class="label">Description <span class="required">*</span></label><textarea class="control"></textarea><div class="form-text">20–2,000 characters</div></div>
    <div class="field mb-3"><label class="label">Attachments</label><div class="form-text mb-2">JPG, PNG, WEBP or PDF, up to 5 MB each, max 5 files</div><input class="control" type="file"></div>
    <div class="actions"><button class="btn btn-primary">Submit Ticket</button><button class="btn btn-outline">Clear</button></div>
  </main>
</body>
</html>
