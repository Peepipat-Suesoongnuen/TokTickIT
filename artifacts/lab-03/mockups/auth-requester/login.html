<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TokTickIT Lab 3 Mockup — Login</title>
  <link rel="stylesheet" href="mockup.css" />
</head>
<body>
  <main class="auth-page">
    <section class="container narrow" aria-label="Login mockup">
      <h1 class="auth-heading">TokTickIT <span class="green">IT Service Desk</span></h1>
      <p class="auth-note">Sign in with your TokTickIT account to continue.</p>

      <div class="card auth-card">
        <div class="card-body">
          <div class="field mb-3">
            <label class="label" for="email">Email</label>
            <input id="email" class="control" value="anucha@example.com" />
          </div>
          <div class="field mb-3">
            <label class="label" for="password">Password</label>
            <input id="password" class="control" type="password" value="Example!Pass" />
          </div>
          <button class="btn btn-primary">Sign In</button>
          <div class="alert alert-error mt-2" role="alert">Invalid email or password.</div>
        </div>
      </div>
      <p class="auth-note mt-2">Mockup note: account-specific login failures intentionally use the same safe message.</p>
    </section>
  </main>
</body>
</html>
